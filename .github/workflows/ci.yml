name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Subscription helpers
        run: npm run test:subscription

      - name: Trial lifecycle
        run: npm run test:trial-lifecycle

      - name: SMS policy
        run: npm run test:sms-policy

      - name: Onboarding first value
        run: npm run test:onboarding-first-value

      - name: Safe redirect
        run: npm run test:safe-redirect

      - name: Profile privileges
        run: npm run test:profile-privileges

      - name: Signup verification
        run: npm run test:signup-verification

      - name: Supabase hardening
        run: npm run test:supabase-hardening

      - name: Stripe map
        run: npm run test:stripe-map

      - name: SMS parser
        run: npm run test:sms-parser

      - name: Address parse
        run: npm run test:address-parse

      - name: Billing status
        run: npm run test:billing

      - name: Night-before send time
        run: npm run test:night-before

      - name: UX audit helpers
        run: npm run test:ux-audit

      - name: Gallery SMS rules
        run: npm run test:gallery-sms

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
